<!DOCTYPE html>
<html>
<head>
    <title>Movie Ticket Booking</title>
</head>
<body>
    <h2>Movie Ticket Booking</h2>

    <form id="bookingForm">
        <input id="name" placeholder="Name" required>
        <input id="email" placeholder="Email" required>
        <input id="seats" type="number" placeholder="Seats" min="1" max="10" required>
        <button type="submit">Book Ticket</button>
    </form>

    <p id="result"></p>

    <script>
        const bookingForm = document.getElementById("bookingForm");
        const result = document.getElementById("result");

        bookingForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const seats = Number(document.getElementById("seats").value);

            const nameRegex = /^[A-Za-z ]+$/;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!nameRegex.test(name)) {
                result.textContent = "Name must contain alphabets only.";
                return;
            }

            if (!emailRegex.test(email)) {
                result.textContent = "Enter a valid email.";
                return;
            }

            if (!Number.isInteger(seats) || seats < 1 || seats > 10) {
                result.textContent = "Seats must be between 1 and 10.";
                return;
            }

            const booking = { name, email, seats };

            result.textContent =
                `Booking Successful! Name: ${booking.name}, Email: ${booking.email}, Seats: ${booking.seats}`;
        });
    </script>
</body>
</html>
