<!DOCTYPE html>
<html>
<head>
    <title>Login Validation</title>
</head>
<body>
    <h2>Login</h2>

    <form id="loginForm">
        <input id="username" placeholder="Username" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p id="message"></p>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const errors = [];

            if (username.length < 5) {
                errors.push("Username must contain at least 5 characters.");
            }

            if (password.length < 8) {
                errors.push("Password must contain at least 8 characters.");
            }

            if (!/[A-Z]/.test(password)) {
                errors.push("Password needs an uppercase letter.");
            }

            if (!/[a-z]/.test(password)) {
                errors.push("Password needs a lowercase letter.");
            }

            if (!/[0-9]/.test(password)) {
                errors.push("Password needs a number.");
            }

            if (!/[^A-Za-z0-9]/.test(password)) {
                errors.push("Password needs a special character.");
            }

            message.textContent = errors.length
                ? errors.join(" ")
                : "Login validation successful!";

            message.style.color = errors.length ? "red" : "green";
        });
    </script>
</body>
</html>
