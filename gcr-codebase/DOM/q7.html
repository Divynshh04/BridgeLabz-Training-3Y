
<!DOCTYPE html>
<html>
<head>
    <title>Mouse Coordinates</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        #box {
            width: 400px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            background: #f0f0f0;
        }
        .dot {
            width: 10px;
            height: 10px;
            background: red;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <h2>Mouse Coordinates Logger</h2>
    <div id="box"></div>
    <p id="coordinates">Move your mouse inside the box.</p>

    <script>
        const box = document.getElementById("box");
        const coordinates = document.getElementById("coordinates");

        box.addEventListener("mousemove", function (event) {
            coordinates.textContent =
                "clientX: " + event.clientX +
                ", clientY: " + event.clientY;
        });

        box.addEventListener("dblclick", function (event) {
            const rectangle = box.getBoundingClientRect();
            const dot = document.createElement("div");

            dot.className = "dot";
            dot.style.left = (event.clientX - rectangle.left) + "px";
            dot.style.top = (event.clientY - rectangle.top) + "px";

            box.appendChild(dot);
        });
    </script>
</body>
</html>
