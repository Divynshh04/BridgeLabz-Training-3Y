
<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input { display: block; margin: 8px 0; padding: 8px; }
        .error { color: red; font-size: 14px; }
        #success { color: green; }
    </style>
</head>
<body>
    <h2>Registration Form</h2>

    <form id="registrationForm" novalidate>
        <label>Name</label>
        <input id="name" type="text">
        <span class="error" id="nameError"></span>

        <label>Email</label>
        <input id="email" type="text">
        <span class="error" id="emailError"></span>

        <label>Password</label>
        <input id="password" type="password">
        <span class="error" id="passwordError"></span>

        <br>
        <button type="submit">Submit</button>
    </form>

    <p id="success"></p>

    <script>
        const form = document.getElementById("registrationForm");
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const success = document.getElementById("success");

        function validateName() {
            const valid = nameInput.value.trim() !== "";
            document.getElementById("nameError").textContent =
                valid ? "" : "Name is required";
            return valid;
        }

        function validateEmail() {
            const valid = emailInput.value.includes("@");
            document.getElementById("emailError").textContent =
                valid ? "" : "Enter a valid email containing @";
            return valid;
        }

        function validatePassword() {
            const valid = passwordInput.value.length >= 6;
            document.getElementById("passwordError").textContent =
                valid ? "" : "Password must be at least 6 characters";
            return valid;
        }

        nameInput.addEventListener("input", validateName);
        emailInput.addEventListener("input", validateEmail);
        passwordInput.addEventListener("input", validatePassword);

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const nameValid = validateName();
            const emailValid = validateEmail();
            const passwordValid = validatePassword();

            if (nameValid && emailValid && passwordValid) {
                success.textContent = "Form Submitted Successfully";
            } else {
                success.textContent = "";
            }
        });
    </script>
</body>
</html>
