
<!DOCTYPE html>
<html>
<head>
    <title>Student Filter</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid gray; padding: 10px; }
    </style>
</head>
<body>
    <h2>Student Records</h2>
    <input id="search" placeholder="Search students">

    <table>
        <thead>
            <tr><th>Name</th><th>Branch</th><th>CGPA</th></tr>
        </thead>
        <tbody id="studentTable">
            <tr><td>Rahul</td><td>CSE</td><td>8.5</td></tr>
            <tr><td>Priya</td><td>AI DS</td><td>9.1</td></tr>
            <tr><td>Aman</td><td>ECE</td><td>7.8</td></tr>
            <tr><td>Neha</td><td>CSE</td><td>8.9</td></tr>
        </tbody>
    </table>

    <p id="noResults" style="display:none">No results found</p>

    <script>
        const search = document.getElementById("search");
        const rows = document.querySelectorAll("#studentTable tr");
        const noResults = document.getElementById("noResults");

        search.addEventListener("input", function () {
            const searchText = search.value.toLowerCase();
            let visibleCount = 0;

            rows.forEach(row => {
                const rowText = row.textContent.toLowerCase();
                const matches = rowText.includes(searchText);

                row.style.display = matches ? "" : "none";

                if (matches) visibleCount++;
            });

            noResults.style.display = visibleCount === 0 ? "block" : "none";
        });
    </script>
</body>
</html>
