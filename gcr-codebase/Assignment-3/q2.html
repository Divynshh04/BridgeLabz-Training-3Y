
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>
    <h1>Online Store Product Catalog</h1>

    <table border="1">
        <tr>
            <th>Product Name</th>
            <th>Image</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>
        <tr>
            <td>Headphones</td>
            <td><img src="headphones.jpg" alt="Headphones" width="100"></td>
            <td>Wireless headphones</td>
            <td>₹1,500</td>
            <td>In Stock</td>
        </tr>
        <tr>
            <td>Keyboard</td>
            <td><img src="keyboard.jpg" alt="Keyboard" width="100"></td>
            <td>Mechanical keyboard</td>
            <td>₹2,000</td>
            <td>In Stock</td>
        </tr>
        <tr>
            <td>Mouse</td>
            <td><img src="mouse.jpg" alt="Mouse" width="100"></td>
            <td>Wireless mouse</td>
            <td>₹800</td>
            <td>Out of Stock</td>
        </tr>
        <tr>
            <td colspan="3">Total Products</td>
            <td colspan="2">3</td>
        </tr>
        <tr>
            <td rowspan="2">Offers</td>
            <td colspan="4">Special discounts available</td>
        </tr>
        <tr>
            <td colspan="4">Free delivery on selected products</td>
        </tr>
    </table>
</body>
</html>
